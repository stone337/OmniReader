name: Build Android APK (OmniReader)

on:
  push:
    branches: [ main ] # 只要您一推送代码到 main 分支，云端立刻自动开启编译！

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 安装 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安装 Flet 0.23.2 稳定版及所有文档解析依赖库
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.23.2 edge-tts python-docx ebooklib beautifulsoup4 PyPDF2 pillow

      - name: 4. 安装安卓 Java 编译环境
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 5. 自动拉起谷歌 Flutter 编译引擎
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'

      - name: 5.5 全自动同意谷歌 Android SDK 所有安全许可协议 (💥 核心必杀技！)
        run: |
          yes | flutter doctor --android-licenses

      - name: 6. 开启云端 Flet 一键编译安卓 APK (100% 原生)
        run: |
          # 💥 架构锁死自愈：指定只为现代 64 位芯片 (arm64-v8a) 打包，跳过损坏的老芯片下载，4 倍速无损冲线！
          yes | flet build apk --arch arm64-v8a

      - name: 7. 上传编译成功的 APK 到云端 Artifacts 归档中
        uses: actions/upload-artifact@v4
        with:
          name: OmniReader-Mobile-APK
          path: build/apk/*.apk
