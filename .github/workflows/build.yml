name: Build Android APK (OmniReader)

on:
  push:
    branches: [ main ] # 只要您一推送代码到 main 分支，云端立刻自动开启编译！

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v3

      - name: 2. 安装 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 3. 安装 Flet 编译器与 Edge-TTS
        run: |
          python -m pip install --upgrade pip
          pip install flet edge-tts

      - name: 4. 安装安卓 Java 编译环境
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 5. 自动拉起谷歌 Flutter 编译引擎
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'

      - name: 6. 开启云端 Flet 一键编译安卓 APK (100% 原生)
        run: |
          # 💥 调用 Flet 官方打包指令，自动生成 Android 原生 APK
          flet build apk --main mobile_app.py

      - name: 7. 上传编译成功的 APK 到云端 Artifacts 归档中
        uses: actions/upload-artifact@v3
        with:
          name: OmniReader-Mobile-APK
          path: build/apk/*.apk
